<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PestScan Pro - IA Urbana</title>
    <meta name="theme-color" content="#022c22">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-navbutton-color" content="#022c22">
    <meta name="apple-mobile-web-app-status-bar-style" content="#022c22">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/dist/tf-tflite.min.js" crossorigin="anonymous"></script>
    <script>
        window.addEventListener('load', () => {
            if (typeof tf === 'undefined' || typeof tflite === 'undefined') {
                console.error('Falha ao carregar bibliotecas do TensorFlow.js via CDN.');
                const overlay = document.getElementById('error-overlay');
                if (overlay && !navigator.onLine) {
                    overlay.innerHTML = '<div style="position:fixed;top:0;left:0;width:100%;background:#ef4444;color:white;padding:10px;text-align:center;z-index:9999;font-size:12px;">Modo Offline: Bibliotecas de IA não encontradas no cache. Conecte-se à internet uma vez para sincronizar.</div>';
                }
            }
        });
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="error-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
